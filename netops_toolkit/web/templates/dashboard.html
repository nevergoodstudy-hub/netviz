{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- 页面标题 -->
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">📊 仪表板</h1>
        <span class="text-sm text-gray-500 dark:text-gray-400">欢迎使用 NetOps Toolkit Web UI</span>
    </div>
    
    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- 设备总数 -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6"
             hx-get="/api/devices" hx-trigger="load" hx-swap="innerHTML" hx-target="#device-count">
            <div class="flex items-center">
                <div class="p-3 rounded-full bg-blue-100 dark:bg-blue-900">
                    <span class="text-2xl">🖥️</span>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">设备总数</p>
                    <p id="device-count" class="text-2xl font-bold text-gray-900 dark:text-white">
                        <span class="htmx-indicator">⏳</span>
                        <span>-</span>
                    </p>
                </div>
            </div>
        </div>
        
        <!-- 在线设备 -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <div class="flex items-center">
                <div class="p-3 rounded-full bg-green-100 dark:bg-green-900">
                    <span class="text-2xl">✅</span>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">在线设备</p>
                    <p class="text-2xl font-bold text-green-600 dark:text-green-400">-</p>
                </div>
            </div>
        </div>
        
        <!-- 今日操作 -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6"
             hx-get="/api/audit/summary" hx-trigger="load" hx-swap="innerHTML" hx-target="#audit-count">
            <div class="flex items-center">
                <div class="p-3 rounded-full bg-purple-100 dark:bg-purple-900">
                    <span class="text-2xl">📝</span>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">今日操作</p>
                    <p id="audit-count" class="text-2xl font-bold text-gray-900 dark:text-white">
                        <span class="htmx-indicator">⏳</span>
                        <span>-</span>
                    </p>
                </div>
            </div>
        </div>
        
        <!-- 告警数 -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <div class="flex items-center">
                <div class="p-3 rounded-full bg-red-100 dark:bg-red-900">
                    <span class="text-2xl">⚠️</span>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">告警数</p>
                    <p class="text-2xl font-bold text-red-600 dark:text-red-400">0</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 快捷操作 -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">⚡ 快捷操作</h2>
        </div>
        <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4">
            <a href="/devices" class="flex flex-col items-center p-4 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <span class="text-3xl mb-2">🖥️</span>
                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">设备管理</span>
            </a>
            <a href="/monitoring" class="flex flex-col items-center p-4 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <span class="text-3xl mb-2">📈</span>
                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">实时监控</span>
            </a>
            <a href="/config" class="flex flex-col items-center p-4 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <span class="text-3xl mb-2">⚙️</span>
                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">配置推送</span>
            </a>
            <a href="/audit" class="flex flex-col items-center p-4 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <span class="text-3xl mb-2">📝</span>
                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">审计日志</span>
            </a>
        </div>
    </div>
    
    <!-- 最近审计日志 -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">📋 最近操作</h2>
            <button class="text-sm text-primary-600 hover:underline"
                    hx-get="/htmx/audit/table?limit=5" hx-target="#recent-logs" hx-swap="innerHTML">
                🔄 刷新
            </button>
        </div>
        <div id="recent-logs" class="p-4" 
             hx-get="/htmx/audit/table?limit=5" hx-trigger="load" hx-swap="innerHTML">
            <div class="text-center py-8 text-gray-500">
                ⏳ 加载中...
            </div>
        </div>
    </div>
</div>

<script>
// 处理 API 响应更新统计
document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.pathInfo.requestPath === '/api/devices') {
        try {
            const data = JSON.parse(evt.detail.xhr.responseText);
            document.querySelector('#device-count').innerHTML = data.count || '-';
        } catch (e) {}
    }
    if (evt.detail.pathInfo.requestPath === '/api/audit/summary') {
        try {
            const data = JSON.parse(evt.detail.xhr.responseText);
            document.querySelector('#audit-count').innerHTML = data.summary?.total || '-';
        } catch (e) {}
    }
});
</script>
{% endblock %}

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-toolkit"
version = "2.0.0"
description = "网络工程实施及测试工具集 - 面向网络工程师的多功能CLI工具箱"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Network Engineering Team", email = "netops@example.com"}
]
keywords = [
    "network", "automation", "cli", "ssh", "ping", "netmiko",
    "network-engineering", "diagnostics", "testing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=14.3.0",
    "questionary>=2.0.1",
    "typer>=0.21.0",
    "textual>=7.4.0",
    "netmiko>=4.6.0",
    "ping3>=4.0.4",
    "dnspython>=2.8.0",
    "textfsm>=1.1.3",
    "pyyaml>=6.0.1",
    "cryptography>=46.0.0",
    "loguru>=0.7.2",
    "tabulate>=0.9.0",
    # Clean Architecture dependencies
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
security = [
    "keyring>=25.0.0",
]
full = [
    "scapy>=2.6.0",
    "speedtest-cli>=2.1.3",
    "ntc-templates>=6.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "keyring>=25.0.0",
    "napalm>=5.0.0",
    "ncclient>=0.6.15",
    "lxml>=5.0.0",
    "aiosmtplib>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "black>=25.0.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "textual-dev>=1.7.0",
]

[project.scripts]
netops = "netops_toolkit.cli:app"
netops-toolkit = "netops_toolkit.cli:app"

[project.urls]
Homepage = "https://github.com/netops-toolkit/netops-toolkit"
Documentation = "https://github.com/netops-toolkit/netops-toolkit#readme"
Repository = "https://github.com/netops-toolkit/netops-toolkit"
Issues = "https://github.com/netops-toolkit/netops-toolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["netops_toolkit*"]

[tool.setuptools.package-data]
netops_toolkit = ["*.yaml", "templates/*.textfsm"]

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E402",  # 历史测试脚本中的非顶层导入
    "E501",  # 历史长行（后续分模块治理）
    "E721",  # 旧代码中类型比较写法
    "E722",  # 旧代码中裸 except
    "E741",  # 旧代码中歧义变量名
    "F401",  # 过渡期未使用导入
    "UP007", # 联合类型迁移遗留
    "UP035", # typing 泛型迁移遗留
    "W291",  # 行尾空白历史问题
    "W293",  # 空白行空格历史问题
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=netops_toolkit --cov-report=term-missing"
cache_dir = ".cache/pytest"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:asyncio",
]

[tool.coverage.run]
source = ["netops_toolkit"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
# 本地开发默认不因覆盖率阻断；CI 使用 --cov-fail-under 强制门禁
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
